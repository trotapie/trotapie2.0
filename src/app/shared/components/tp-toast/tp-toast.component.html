<div #stack popover="manual" class="toast-stack" aria-live="polite">@for(item of toast.notifications();track item.id){<section tpMotion="menu" class="toast" [class]="'toast toast-'+item.variant" [attr.role]="item.variant==='error'?'alert':'status'"><tp-icon [name]="item.variant==='success'?'check':item.variant==='error'?'close':'bell'" /><div><h3>{{ item.title }}</h3><p>{{ item.message }}</p></div><button type="button" aria-label="Cerrar notificación" (click)="toast.dismiss(item.id)"><tp-icon name="close" /></button></section>}</div>
