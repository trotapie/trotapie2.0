<header class="public-header">
  <a routerLink="/" [attr.aria-label]="text('Trotapie, inicio', 'Trotapie, home')" (click)="homeSelected.emit($event)"><img src="/brand/trotapie.png" alt="Trotapie Travel" /></a>
  <nav [attr.aria-label]="text('Sitio público', 'Public site')" [tpNavIndicator]="activeSection()">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a routerLink="/" [class.active]="activeSection()==='home'" [attr.aria-current]="activeSection()==='home'?'page':null" (click)="homeSelected.emit($event)">{{ text('Inicio', 'Home') }}</a>
    <a routerLink="/" fragment="destinos" [class.active]="activeSection()==='destinations'" [attr.aria-current]="activeSection()==='destinations'?'page':null" (click)="destinationsSelected.emit($event)">{{ text('Destinos', 'Destinations') }}</a>
    <a routerLink="/circuitos" [class.active]="activeSection()==='circuits'" [attr.aria-current]="activeSection()==='circuits'?'page':null">{{ text('Circuitos', 'Tours') }}</a>
    <a routerLink="/promociones" [class.active]="activeSection()==='offers'" [attr.aria-current]="activeSection()==='offers'?'page':null">{{ text('Promociones', 'Offers') }}</a>
  </nav>
  <div class="public-tools">
    <tp-theme-toggle [english]="english()" />
    <tp-language-menu [english]="english()" (changed)="languageChanged.emit()" />
  </div>
</header>
