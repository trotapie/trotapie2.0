<button
  type="button"
  class="tp-actions-menu__trigger"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  [attr.aria-expanded]="abierto"
  aria-haspopup="menu"
  [attr.title]="tooltip"
  (click)="alternar()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin">
  <tp-icon aria-hidden="true" [name]="'more'"></tp-icon>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="abierto"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
  [cdkConnectedOverlayPositions]="posiciones"
  [cdkConnectedOverlayPush]="true"
  (overlayKeydown)="$event.key==='Escape' && cerrar()" (backdropClick)="cerrar()"
  (detach)="cerrar()">
  <section tpMotion="menu" tpPopupKeyboard (dismissed)="cerrar()" class="tp-actions-menu__panel" role="menu" [attr.aria-label]="ariaLabel" >
    @for (action of actions; track action.id) {
      <button
        type="button"
        class="tp-actions-menu__item"
        role="menuitem"
        [disabled]="action.disabled"
        [class.tp-actions-menu__item--danger]="action.danger"
        (click)="seleccionar(action)">
        @if (action.icon) {
          <tp-icon [name]="action.icon" aria-hidden="true"></tp-icon>
        }
        <span>{{ action.label }}</span>
      </button>
    }
  </section>
</ng-template>
