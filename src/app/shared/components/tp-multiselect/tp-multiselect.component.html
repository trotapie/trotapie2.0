<div class="tp-multiselect" [class.tp-multiselect--disabled]="disabled" [class.tp-multiselect--open]="abierto">
  @if (label) {
    <label class="tp-multiselect__label" [class.tp-multiselect__label--required]="required">{{ label }}</label>
  }

  <button
    type="button"
    class="tp-multiselect__trigger"
    [disabled]="disabled"
    [attr.aria-expanded]="abierto"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-label]="label || placeholder"
    (click)="abierto ? cerrar() : abrir()"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin">
    <span class="tp-multiselect__value" [class.tp-multiselect__value--placeholder]="!valoresSeleccionados.length">
      {{ textoSeleccion }}
    </span>
    <tp-icon [name]="abierto ? 'chevron-up' : 'chevron-down'"></tp-icon>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="abierto"
    [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop" [cdkConnectedOverlayViewportMargin]="12"
    [cdkConnectedOverlayPositions]="posiciones"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayFlexibleDimensions]="true"
    (overlayKeydown)="$event.key==='Escape' && cerrar()" (backdropClick)="cerrar()"
    (detach)="cerrar()">
    <section tpMotion="menu" tpPopupKeyboard (dismissed)="cerrar()" class="tp-multiselect__panel" role="listbox" [attr.aria-label]="label || placeholder" aria-multiselectable="true">
      <div class="tp-multiselect__search">
        <tp-icon [name]="'search'"></tp-icon>
        <input
          #searchInput
          type="search"
          [placeholder]="searchPlaceholder"
          [value]="busqueda"
          (input)="busqueda = $any($event.target).value"
          
          aria-label="Filtrar opciones" />
        @if (busqueda) {
          <button type="button" aria-label="Limpiar búsqueda" (click)="busqueda = ''; searchInput.focus()">
            <tp-icon [name]="'close'"></tp-icon>
          </button>
        }
      </div>

      <div class="tp-multiselect__actions">
        <button type="button" class="tp-multiselect__action" (click)="alternarTodas()">
          {{ todasLasVisiblesSeleccionadas ? 'Quitar visibles' : 'Seleccionar visibles' }}
        </button>
        <button type="button" class="tp-multiselect__action" [disabled]="!valoresSeleccionados.length" (click)="limpiar()">
          Limpiar
        </button>
      </div>

      <div class="tp-multiselect__options">
        @if (opcionesFiltradas.length) {
          @for (option of opcionesFiltradas; track trackByValue($index, option)) {
            <label
              class="tp-multiselect__option"
              ><input type="checkbox" [checked]="estaSeleccionada(option.value)" [disabled]="option.disabled" (change)="alternar(option)" />
              {{ option.label }}
            </label>
          }
        } @else {
          <p class="tp-multiselect__empty">{{ emptyMessage }}</p>
        }
      </div>
    </section>
  </ng-template>
</div>
