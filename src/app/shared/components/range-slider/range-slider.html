<div class="range-slider" role="group" [attr.aria-label]="label()"><div class="range-track" aria-hidden="true"><span [style.left.%]="start()" [style.width.%]="end()-start()"></span></div><input class="range-handle lower" type="range" [min]="min()" [max]="max()" [step]="step()" [value]="low()" [attr.aria-label]="lowerLabel()" [attr.aria-valuetext]="low()+' estrellas'" (input)="update('lower',$event)"/><input class="range-handle upper" type="range" [min]="min()" [max]="max()" [step]="step()" [value]="high()" [attr.aria-label]="upperLabel()" [attr.aria-valuetext]="high()+' estrellas'" (input)="update('upper',$event)"/></div><div class="range-values" aria-hidden="true"><span>{{low()}} ★</span><span>{{high()}} ★</span></div>
