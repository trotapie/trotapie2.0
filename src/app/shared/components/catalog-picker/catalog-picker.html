<button class="catalog-title" type="button" aria-haspopup="dialog" [attr.aria-expanded]="open()" (click)="show()">{{label()}}<tp-icon name="chevron-down"/></button>
<tp-dialog [open]="open()" title="Cambiar catálogo" placement="adaptive" (closed)="open.set(false)"><p class="hint">Desliza para explorar o selecciona un catálogo.</p><div class="wheel-frame"><div class="selection-band" aria-hidden="true"></div><div #wheel class="wheel" (scroll)="scroll($event)" aria-label="Catálogos disponibles">@for(option of options();track option.value;let i=$index){<button type="button" [class.current]="index()===i" [style.opacity]="opacity(i)" [attr.aria-current]="value()===option.value?'true':null" (click)="choose(option.value)">{{option.label}}</button>}</div></div><div class="dialog-actions"><button tpButton (click)="open.set(false)">Cancelar</button><button tpButton icon="check" variant="primary" (click)="choose(options()[index()].value)">Abrir catálogo</button></div></tp-dialog>
