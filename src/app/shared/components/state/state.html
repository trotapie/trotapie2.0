@if(mode()==='loading'){<tp-screen-loader [message]="message() || 'Preparando tu siguiente paso…'" />}@else{<div class="state" [attr.role]="mode()==='error'?'alert':'status'"><div class="state-icon"><tp-icon [name]="mode()==='error'?'refresh':'suitcase'"/></div><h3>{{title()||(mode()==='error'?'No pudimos cargar la información':'Todo listo para empezar')}}</h3><p>{{message()||(mode()==='error'?'Revisa tu conexión e intenta de nuevo.':'Los registros aparecerán aquí en cuanto los agregues.')}}</p>@if(mode()==='error'){<button tpButton icon="refresh" (click)="retry.emit()">Reintentar</button>}<ng-content/></div>}
