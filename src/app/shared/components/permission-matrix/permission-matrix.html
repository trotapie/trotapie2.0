<div class="matrix-toolbar"><span>{{selected().length}} permisos seleccionados</span><label><input type="checkbox" [checked]="selected().length===permissions().length&&permissions().length>0" [disabled]="disabled()" (change)="all()"/>Seleccionar todos</label></div><div class="table-scroll"><table class="permission-matrix"><thead><tr><th scope="col">Módulo</th>@for(action of actions();track action){<th scope="col">{{label(action)}}</th>}</tr></thead><tbody>@for(group of groups();track group){<tr><th scope="row">{{group}}</th>@for(action of actions();track action){<td>@if(permission(group,action);as p){<input type="checkbox" [checked]="selected().includes(p.id)" [disabled]="disabled()" [attr.aria-label]="label(action)+' '+group" [title]="p.description" (change)="toggle(p.id,$any($event.target).checked)"/>}@else{<span>—</span>}</td>}</tr>}</tbody></table></div>
