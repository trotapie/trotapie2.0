<svg #svg [attr.viewBox]="'0 0 '+width()+' '+height()" role="img" aria-label="Flyer editable del circuito" (pointermove)="move($event)" (pointerup)="stop()" (pointercancel)="stop()"><rect [attr.width]="width()" [attr.height]="height()" [attr.fill]="background().type==='color'?background().value:'#f2f1ef'"/>@if(background().type==='image'){<image [attr.href]="text(background().value)" [attr.width]="width()" [attr.height]="height()" preserveAspectRatio="xMidYMid slice"/>}
@for(item of elements();track item.id){@if(item.visible!==false){<g [attr.transform]="transform(item)" [attr.opacity]="item.fabricConfig['opacity']??1" tabindex="0" role="button" [attr.aria-label]="'Seleccionar '+(item.fabricConfig['text']||item.type)" (pointerdown)="start($event,item)" (keydown)="key($event,item)">
@switch(item.type){@case('image'){<image [attr.href]="text(item.fabricConfig['src'])" [attr.width]="item.fabricConfig['width']||400" [attr.height]="item.fabricConfig['height']||300" preserveAspectRatio="xMidYMid slice"/>}@case('qr'){<image [attr.href]="text(item.fabricConfig['src'])" [attr.width]="item.fabricConfig['width']||150" [attr.height]="item.fabricConfig['height']||150"/>}@case('rectangle'){<rect [attr.width]="item.fabricConfig['width']||300" [attr.height]="item.fabricConfig['height']||150" [attr.rx]="item.fabricConfig['rx']||0" [attr.fill]="item.fabricConfig['fill']||'#ebc8a8'"/>}@case('circle'){<circle [attr.cx]="item.fabricConfig['radius']||50" [attr.cy]="item.fabricConfig['radius']||50" [attr.r]="item.fabricConfig['radius']||50" [attr.fill]="item.fabricConfig['fill']||'#ebc8a8'"/>}@case('line'){<line x1="0" y1="0" [attr.x2]="item.fabricConfig['width']||300" [attr.y2]="item.fabricConfig['height']||0" [attr.stroke]="item.fabricConfig['stroke']||item.fabricConfig['fill']||'#202420'" [attr.stroke-width]="item.fabricConfig['strokeWidth']||2"/>}@default{<text [attr.fill]="item.fabricConfig['fill']||'#202420'" [attr.font-size]="item.fabricConfig['fontSize']||32" [attr.font-family]="item.fabricConfig['fontFamily']||'Arial, sans-serif'" [attr.font-weight]="item.fabricConfig['fontWeight']||400" dominant-baseline="hanging">@for(line of lines(item);track $index){<tspan x="0" [attr.dy]="$index===0?0:(item.fabricConfig['fontSize']||32)*1.2">{{line}}</tspan>}</text>}}
@if(selected()===item.id){<rect class="selection-outline" x="-6" y="-6" [attr.width]="(item.fabricConfig['width']||600)+12" [attr.height]="(item.fabricConfig['height']||item.fabricConfig['fontSize']*1.5||60)+12" fill="none" stroke="#137053" stroke-width="2" stroke-dasharray="8 5"/>}
</g>}}
</svg>
