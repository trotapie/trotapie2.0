<tp-page-header [title]="'Permisos de '+(role()?.name||'rol')" description="Elige qué puede consultar y administrar este rol. Los permisos existentes siguen protegiendo las acciones." eyebrow="Trotapie / Configuración"><a tpButton variant="back" icon="left" routerLink="/admin/configuracion">Regresar</a><button tpButton icon="check" variant="primary" [busy]="saving()" [disabled]="loading()||saving()" (click)="save()">Guardar permisos</button></tp-page-header>@if(error()){<div class="error-banner" role="alert">{{error()}}</div>}<section class="panel">@if(loading()){<tp-state mode="loading"/>}@else{<tp-permission-matrix [permissions]="permissions()" [selected]="selected()" [disabled]="saving()" (selectedChange)="selected.set($event)"/>}</section>
